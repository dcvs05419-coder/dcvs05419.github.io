<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UtilityHub - Рабочие Утилиты</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --dark: #34495e;
            --light: #ecf0f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .utility-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .utility-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .utility-card:hover {
            transform: translateY(-5px);
        }

        .utility-card h3 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.4em;
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--dark);
            font-weight: 500;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn-primary {
            background: var(--secondary);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: var(--light);
            border-radius: 8px;
            border-left: 4px solid var(--secondary);
            display: none;
        }

        .converter-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            align-items: end;
        }

        .converter-arrow {
            text-align: center;
            font-size: 2em;
            color: var(--secondary);
        }

        .timer-display {
            font-size: 3em;
            text-align: center;
            margin: 20px 0;
            color: var(--primary);
            font-weight: bold;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .color-preview {
            width: 100%;
            height: 60px;
            border-radius: 8px;
            margin-top: 10px;
            border: 2px solid #ddd;
        }

        @media (max-width: 768px) {
            .utility-grid {
                grid-template-columns: 1fr;
            }
            
            .converter-grid {
                grid-template-columns: 1fr;
            }
            
            .converter-arrow {
                transform: rotate(90deg);
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛠️ UtilityHub</h1>
            <p>Набор полезных утилит для повседневных задач</p>
        </div>

        <div class="utility-grid">
            <!-- Конвертер валют -->
            <div class="utility-card">
                <h3>💱 Конвертер Валют</h3>
                <div class="converter-grid">
                    <div class="input-group">
                        <label>Сумма</label>
                        <input type="number" id="amount" value="100" min="0">
                    </div>
                    <div class="converter-arrow">⇄</div>
                    <div class="input-group">
                        <label>Из валюты</label>
                        <select id="fromCurrency">
                            <option value="USD">USD - Доллар США</option>
                            <option value="EUR">EUR - Евро</option>
                            <option value="RUB" selected>RUB - Российский рубль</option>
                            <option value="GBP">GBP - Фунт стерлингов</option>
                            <option value="JPY">JPY - Японская иена</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>В валюту</label>
                        <select id="toCurrency">
                            <option value="USD">USD - Доллар США</option>
                            <option value="EUR" selected>EUR - Евро</option>
                            <option value="RUB">RUB - Российский рубль</option>
                            <option value="GBP">GBP - Фунт стерлингов</option>
                            <option value="JPY">JPY - Японская иена</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="convertCurrency()">Конвертировать</button>
                <div class="result" id="currencyResult"></div>
            </div>

            <!-- Калькулятор -->
            <div class="utility-card">
                <h3>🧮 Калькулятор</h3>
                <div class="input-group">
                    <label>Выражение</label>
                    <input type="text" id="calcInput" placeholder="Например: 2 + 2 * 3">
                </div>
                <button class="btn btn-success" onclick="calculate()">Вычислить</button>
                <div class="result" id="calcResult"></div>
            </div>

            <!-- Таймер -->
            <div class="utility-card">
                <h3>⏱️ Таймер</h3>
                <div class="input-group">
                    <label>Минуты</label>
                    <input type="number" id="timerMinutes" value="5" min="1" max="60">
                </div>
                <div class="timer-display" id="timerDisplay">05:00</div>
                <div class="timer-controls">
                    <button class="btn btn-success" onclick="startTimer()">Старт</button>
                    <button class="btn btn-warning" onclick="pauseTimer()">Пауза</button>
                    <button class="btn btn-danger" onclick="resetTimer()">Сброс</button>
                </div>
            </div>

            <!-- Генератор паролей -->
            <div class="utility-card">
                <h3>🔐 Генератор Паролей</h3>
                <div class="input-group">
                    <label>Длина пароля</label>
                    <input type="number" id="passLength" value="12" min="6" max="32">
                </div>
                <div class="input-group">
                    <label>
                        <input type="checkbox" id="useUpperCase" checked> Заглавные буквы
                    </label>
                    <label>
                        <input type="checkbox" id="useNumbers" checked> Цифры
                    </label>
                    <label>
                        <input type="checkbox" id="useSymbols"> Символы
                    </label>
                </div>
                <button class="btn btn-primary" onclick="generatePassword()">Сгенерировать</button>
                <div class="result" id="passwordResult"></div>
            </div>

            <!-- Конвертер цветов -->
            <div class="utility-card">
                <h3>🎨 Конвертер Цветов</h3>
                <div class="input-group">
                    <label>HEX цвет</label>
                    <input type="text" id="hexColor" placeholder="#ff0000" maxlength="7">
                </div>
                <div class="input-group">
                    <label>RGB цвет</label>
                    <input type="text" id="rgbColor" placeholder="rgb(255, 0, 0)" readonly>
                </div>
                <div class="color-preview" id="colorPreview"></div>
                <button class="btn btn-primary" onclick="convertColor()">Конвертировать</button>
            </div>

            <!-- Кодировщик Base64 -->
            <div class="utility-card">
                <h3>📄 Base64 Кодировщик</h3>
                <div class="input-group">
                    <label>Текст для кодирования/декодирования</label>
                    <textarea id="base64Text" rows="3" placeholder="Введите текст..."></textarea>
                </div>
                <button class="btn btn-success" onclick="encodeBase64()">Закодировать</button>
                <button class="btn btn-warning" onclick="decodeBase64()">Декодировать</button>
                <div class="result" id="base64Result"></div>
            </div>
        </div>
    </div>

    <script>
        // Конвертер валют (фиксированные курсы для примера)
        const exchangeRates = {
            USD: { EUR: 0.85, RUB: 75.50, GBP: 0.73, JPY: 110.25 },
            EUR: { USD: 1.18, RUB: 88.75, GBP: 0.86, JPY: 129.80 },
            RUB: { USD: 0.013, EUR: 0.011, GBP: 0.0097, JPY: 1.46 },
            GBP: { USD: 1.37, EUR: 1.16, RUB: 103.20, JPY: 151.10 },
            JPY: { USD: 0.0091, EUR: 0.0077, RUB: 0.68, GBP: 0.0066 }
        };

        function convertCurrency() {
            const amount = parseFloat(document.getElementById('amount').value);
            const from = document.getElementById('fromCurrency').value;
            const to = document.getElementById('toCurrency').value;
            
            if (from === to) {
                showResult('currencyResult', `Результат: ${amount} ${from}`);
                return;
            }
            
            const rate = exchangeRates[from][to];
            const result = (amount * rate).toFixed(2);
            showResult('currencyResult', `${amount} ${from} = ${result} ${to}`);
        }

        // Калькулятор
        function calculate() {
            const input = document.getElementById('calcInput').value;
            try {
                const result = eval(input);
                showResult('calcResult', `Результат: ${result}`);
            } catch (e) {
                showResult('calcResult', 'Ошибка в выражении');
            }
        }

        // Таймер
        let timer;
        let timeLeft;
        let isRunning = false;

        function startTimer() {
            if (isRunning) return;
            
            const minutes = parseInt(document.getElementById('timerMinutes').value);
            timeLeft = minutes * 60;
            isRunning = true;
            
            timer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    isRunning = false;
                    alert('Время вышло!');
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timer);
            isRunning = false;
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            const minutes = parseInt(document.getElementById('timerMinutes').value);
            timeLeft = minutes * 60;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timerDisplay').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Генератор паролей
        function generatePassword() {
            const length = parseInt(document.getElementById('passLength').value);
            const useUpperCase = document.getElementById('useUpperCase').checked;
            const useNumbers = document.getElementById('useNumbers').checked;
            const useSymbols = document.getElementById('useSymbols').checked;
            
            let charset = 'abcdefghijklmnopqrstuvwxyz';
            if (useUpperCase) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (useNumbers) charset += '0123456789';
            if (useSymbols) charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            let password = '';
            for (let i = 0; i < length; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            
            showResult('passwordResult', `Сгенерированный пароль: ${password}`);
        }

        // Конвертер цветов
        function convertColor() {
            const hex = document.getElementById('hexColor').value;
            const hexRegex = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i;
            const result = hexRegex.exec(hex);
            
            if (result) {
                const r = parseInt(result[1], 16);
                const g = parseInt(result[2], 16);
                const b = parseInt(result[3], 16);
                const rgb = `rgb(${r}, ${g}, ${b})`;
                
                document.getElementById('rgbColor').value = rgb;
                document.getElementById('colorPreview').style.backgroundColor = hex;
            } else {
                alert('Неверный HEX формат');
            }
        }

        // Base64 кодировщик
        function encodeBase64() {
            const text = document.getElementById('base64Text').value;
            const encoded = btoa(unescape(encodeURIComponent(text)));
            showResult('base64Result', `Закодировано: ${encoded}`);
        }

        function decodeBase64() {
            const text = document.getElementById('base64Text').value;
            try {
                const decoded = decodeURIComponent(escape(atob(text)));
                showResult('base64Result', `Декодировано: ${decoded}`);
            } catch (e) {
                showResult('base64Result', 'Ошибка декодирования');
            }
        }

        // Вспомогательная функция для отображения результатов
        function showResult(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        // Инициализация
        document.getElementById('hexColor').addEventListener('input', convertColor);
        updateTimerDisplay();
    </script>
</body>
</html>
