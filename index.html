    <style>

    html, body {
        overflow-x: hidden; 
        width: 100vw; 
    }


    body {
            margin: 0;
            padding: 0;
            font-family: Roboto, Arial, sans-serif;
            background: #fff;
            color: #5f6368;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }

        img {
            max-width: 100%;
            height: 100px;
        }

        h1 {
            font-size: 24px;
            color: #3c4043;
            margin: 16px 0;
        }

        p {
            margin: 8px 25px;
            font-size: 14px;
        }

        .error-code {
            color: #9e9e9e;
            margin-top: 16px;
        }

        .btn {
            margin-top: 32px;
            padding: 10px 24px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #1765c3;
        }

     

    audio {
    width: 26vw;
    background-color: rgba(255, 255, 255, 0.3);
    border-radius: 20px;
    filter: opacity(0.0);
    transform: scale(7.0) !important;
    z-index: 100;
    position: absolute;
    left: 79%;
    top: 64%;
}





    audio::-webkit-media-controls-panel {
        background-color: rgba(255, 255, 255, 0.3) !important;
    }
    audio::-webkit-media-controls-play-button,
    audio::-webkit-media-controls-pause-button {
        width: 50% !important;
        height: 50% !important;
        transform: scale(5) !important;
    }
    audio::-moz-media-controls-play-button {
        width: 50% !important;
        height: 50% !important;
        transform: scale(5) !important;
    }
    audio::-ms-media-controls-play-button {
        width: 50% !important;
        height: 50% !important;
        transform: scale(5) !important;
    }
